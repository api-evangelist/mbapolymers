name: MBA Polymers
description: >-
  MBA Polymers is a global plastics recycling company founded in 1997 that
  transforms waste plastics recovered from end-of-life durable goods such as
  computers, electronics, appliances, and automobiles into high-quality
  post-consumer recycled polymer granulates. Grades include ABS, impact-modified
  PS, PC/ABS, PP copolymer, and HDPE, produced through a three-step separate,
  clean, and finish process across operations in several countries. The company
  publishes no developer API, SDK, or technical developer surface; it was added
  to the API Evangelist network as a portfolio-company profile of
  balderton-capital.
